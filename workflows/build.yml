name: Build Origin VPN

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download libv2ray.aar
        uses: robinraju/release-downloader@v1.11
        with:
          repository: '2dust/AndroidLibXrayLite'
          latest: true
          fileName: 'libv2ray.aar'
          out-file-path: 'app/libs'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: origin-vpn-debug
          path: app/build/outputs/apk/debug/*.apk

          - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d

      - name: Clone hev-socks5-tunnel source
        run: |
          mkdir -p hevtun-build
          cd hevtun-build
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel jni

      - name: Compile native library with NDK
        run: |
          cd hevtun-build
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build APP_ABI="arm64-v8a armeabi-v7a x86_64"

      - name: Copy .so files into app
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r hevtun-build/libs/* app/src/main/jniLibs/
